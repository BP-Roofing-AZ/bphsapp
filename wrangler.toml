# Cloudflare configuration.
# This project uses Pages for the static frontend + (in production)
# Workers for the API. Local dev + CI deploys both. Real bindings
# are provisioned per-environment on the account owner's Cloudflare
# account — the commented blocks below are the expected shape.

name = "bphsapp"
compatibility_date = "2025-01-01"
pages_build_output_dir = "frontend"

# Non-secret configuration. Secrets go through `wrangler secret put`
# (see README.md for the full list).
[vars]
APP_BASE_URL = "https://app.blueprinthomeservice.com"
OUTBOUND_FROM_ADDRESS = "office@blueprinthomeservice.com"

# ── Workers-side config (production only) ─────────────────────
# Uncomment on the account owner's environment. Deploy the Worker
# separately with `wrangler deploy --config wrangler.worker.toml`
# after provisioning the D1 + R2 bindings below.

# main = "src/index.js"

# [[d1_databases]]
# binding = "DB"
# database_name = "bphs-db"
# database_id = "REPLACE_WITH_D1_UUID"

# [[r2_buckets]]
# binding = "FILES"
# bucket_name = "bphs-files"

# [triggers]
# crons = ["*/5 * * * *"]

# [[routes]]
# pattern = "app.blueprinthomeservice.com/*"
# zone_name = "blueprinthomeservice.com"
