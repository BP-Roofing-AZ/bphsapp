# Cloudflare Workers configuration.
# Real bindings are provisioned per-environment (staging / production)
# by the account owner. The commented-out blocks below are the
# expected shape — uncomment and fill in the actual database IDs +
# bucket names on your own account before deploying.

name = "bphsapp"
main = "src/index.js"
compatibility_date = "2025-01-01"
workers_dev = false
account_id = "REPLACE_WITH_ACCOUNT_ID"

# [vars] are non-secret configuration. Secrets go through
# `wrangler secret put` — see README.md for the full list.
[vars]
APP_BASE_URL = "https://app.blueprinthomeservice.com"
OUTBOUND_FROM_ADDRESS = "office@blueprinthomeservice.com"

# D1 database binding (primary datastore).
# [[d1_databases]]
# binding = "DB"
# database_name = "bphs-db"
# database_id = "REPLACE_WITH_D1_UUID"

# R2 bucket binding (files, photos, PDFs).
# [[r2_buckets]]
# binding = "FILES"
# bucket_name = "bphs-files"

# Scheduled worker — nightly maintenance + JobNimbus sync.
# [triggers]
# crons = ["*/5 * * * *"]

# Custom domain routing (production only).
# [[routes]]
# pattern = "app.blueprinthomeservice.com/*"
# zone_name = "blueprinthomeservice.com"

[build]
command = ""

